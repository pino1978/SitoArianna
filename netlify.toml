[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep a single public hostname. This prevents the default Netlify domain
# from becoming a duplicate crawl/indexing candidate.
[[redirects]]
  from = "https://sitoarianna.netlify.app/*"
  to = "https://www.ariannamilano.it/:splat"
  status = 301
  force = true

# Backward-compatible target for the social image currently referenced
# by Open Graph/Twitter metadata.
[[redirects]]
  from = "/images/hero-home.jpg"
  to = "/images/ying-eagle-hero.webp"
  status = 301
  force = true

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/admin-*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
