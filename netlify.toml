[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep a single public hostname. This prevents the default Netlify domain
# from becoming a duplicate crawl/indexing candidate.
[[redirects]]
  from = "https://sitoarianna.netlify.app/*"
  to = "https://www.ariannamilano.it/:splat"
  status = 301
  force = true

# Backward-compatible target for previously cached social image URLs.
[[redirects]]
  from = "/images/hero-home.jpg"
  to = "/images/arianna_og_1200x630.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/images/og-arianna-milano.jpg"
  to = "/images/arianna_og_1200x630.jpg"
  status = 301
  force = true

[[redirects]]
  from = "/palmares/"
  to = "/risultati/"
  status = 301
  force = true

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Results is actively being refined: avoid serving a stale HTML document
# from browser/CDN caches while the layout is under adjustment.
[[headers]]
  for = "/risultati/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# Admin console must always load the current HTML. Astro emits hashed JS/CSS
# assets, so once the latest HTML is fetched the browser automatically requests
# the correct versioned assets for that deploy.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/admin-*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
