[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep a single public hostname. This prevents the default Netlify domain
# from becoming a duplicate crawl/indexing candidate.
[[redirects]]
  from = "https://sitoarianna.netlify.app/*"
  to = "https://www.ariannamilano.it/:splat"
  status = 301
  force = true

# Backward-compatible target for the social image currently referenced
# by Open Graph/Twitter metadata. The metadata still points to the legacy
# URL, which now resolves to the approved 1200x630 Arianna OG artwork.
[[redirects]]
  from = "/images/hero-home.jpg"
  to = "/images/og-arianna-milano.jpg"
  status = 301
  force = true

# Results is actively being refined: avoid serving a stale HTML document
# from browser/CDN caches while the layout is under adjustment.
[[headers]]
  for = "/risultati/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# Admin console must always load the current HTML. Astro emits hashed JS/CSS
# assets, so once the latest HTML is fetched the browser automatically requests
# the correct versioned assets for that deploy.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/admin-*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
